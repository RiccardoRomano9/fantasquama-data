# Aggiorna serieA.json con le probabili formazioni del momento.
#
# Gira sulle macchine di GitHub: il Mac puo' restare spento. Il commit lo fa
# il GITHUB_TOKEN che Actions mette a disposizione da solo, quindi non c'e'
# nessun segreto da configurare.
name: aggiorna

on:
  schedule:
    # DeepSeek genera la nota dei Consigli solo se e' il giorno della prima
    # partita e sono passate le 10 italiane. Due orari coprono ora legale e
    # solare senza sprecare token: se la nota esiste gia', non richiama nulla.
    - cron: "5 8 * * *"
    - cron: "5 9 * * *"
    # In settimana le probabili si muovono poco: due ore bastano.
    - cron: "17 */2 * * *"
    # Nei giorni di gara si muovono fino a un'ora dal calcio d'inizio, ed e'
    # lì che una formazione vecchia di due ore fa schierare un infortunato.
    # Ogni giorno, ogni quarto d'ora nella fascia calda delle formazioni:
    # i turni infrasettimanali e i recuperi li decide il calendario, non il
    # giorno della settimana. Se non c'e' una partita vicina, `aggiorna.py`
    # esce senza scaricare nulla.
    # GitHub cron usa UTC: 10-22 UTC copre le 12-23 in ora legale e include
    # anche le 23 in ora solare. C'e' una piccola ora extra in inverno, ma
    # meglio una lettura in piu' che saltare l'ultima finestra pre-gara.
    #
    # I cron di GitHub sono a discrezione: sotto carico partono anche con
    # dieci minuti di ritardo, e non c'e' modo di pretenderne di più. E' il
    # motivo per cui la scheda «Probabili» ha comunque il tira-giù.
    - cron: "*/15 10-22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  # due esecuzioni sovrapposte si contenderebbero lo stesso commit
  group: fantasquama-data-writer
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scarica le probabili e aggiorna
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python aggiorna.py

      - name: Committa, ma solo se e' cambiato qualcosa
        run: |
          # `git status` e non `git diff`: su un file non ancora tracciato
          # `git diff` non vede nessuna differenza e ritorna zero, quindi alla
          # prima esecuzione il file non verrebbe committato -- e restando non
          # tracciato non lo sarebbe piu' a nessuna esecuzione successiva.
          if [ -z "$(git status --porcelain -- serieA.json)" ]; then
            echo "niente di nuovo: nessun commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add serieA.json
          git commit -m "Probabili formazioni al $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push
