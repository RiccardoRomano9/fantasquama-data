# Aggiorna serieA.json con le probabili formazioni del momento.
#
# Gira sulle macchine di GitHub: il Mac puo' restare spento. Il commit lo fa
# il GITHUB_TOKEN che Actions mette a disposizione da solo, quindi non c'e'
# nessun segreto da configurare.
name: aggiorna

on:
  schedule:
    # In settimana le probabili si muovono poco: due ore bastano.
    - cron: "17 */2 * * *"
    # Nei giorni di gara si muovono fino a un'ora dal calcio d'inizio, ed e'
    # lì che una formazione vecchia di due ore fa schierare un infortunato.
    # Venerdì-lunedì, dalle 12 alle 23 italiane, ogni quarto d'ora.
    #
    # I cron di GitHub sono a discrezione: sotto carico partono anche con
    # dieci minuti di ritardo, e non c'e' modo di pretenderne di più. E' il
    # motivo per cui la scheda «Probabili» ha comunque il tira-giù.
    - cron: "*/15 10-21 * * 5,6,0,1"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  # due esecuzioni sovrapposte si contenderebbero lo stesso commit
  group: aggiorna
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scarica le probabili e aggiorna
        run: python aggiorna.py

      - name: Committa, ma solo se e' cambiato qualcosa
        run: |
          # `git status` e non `git diff`: su un file non ancora tracciato
          # `git diff` non vede nessuna differenza e ritorna zero, quindi alla
          # prima esecuzione il file non verrebbe committato -- e restando non
          # tracciato non lo sarebbe piu' a nessuna esecuzione successiva.
          if [ -z "$(git status --porcelain -- serieA.json)" ]; then
            echo "niente di nuovo: nessun commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add serieA.json
          git commit -m "Probabili formazioni al $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push
